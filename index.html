<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floot Business — Sign Up / Listener</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>body{font-family:system-ui;background:#7C3AED;margin:0;padding:14px} .card{max-width:440px;margin:auto;background:#fff;border-radius:22px;padding:20px} input,button,select{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box} button{background:#7C3AED;color:#fff;border:0;font-weight:800;cursor:pointer} .ghost{background:#F5F3FF;color:#7C3AED} .stat{background:#F5F3FF;border-radius:14px;padding:12px;margin:8px 0} .row{background:#FBFAFF;border:1px solid #EDE9FE;border-radius:12px;padding:10px;margin:8px 0;font-size:13px} .pill{display:inline-block;background:#EDE9FE;color:#5B21B6;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px} .muted{color:#666;font-size:12px} .err{color:red} .ok{color:green} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style>
</head>
<body><div class="card" id="app"><h2>FLOOT NG — Business</h2><p class="muted">Business signup = Ride signup • Same login, same wallet • Business listens, Customer books</p><div id="content">Loading...</div></div>
<script>
// === SAME Firebase project as Ride — THIS IS THE WHOLE FIX ===
const firebaseConfig = {
  apiKey: "YOUR_API_KEY_FROM_RIDE_APP", // copy exact from ride.floot.com.ng
  authDomain: "floot-delivery.firebaseapp.com",
  projectId: "floot-delivery",
  storageBucket: "floot-delivery.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
try{ firebase.initializeApp(firebaseConfig); }catch(e){ document.getElementById('content').innerHTML = '<p style="color:red">Firebase init failed: '+e.message+'<br>Check apiKey / projectId in firebaseConfig.</p>'; showAuth(); }
const auth = firebase.auth();
const db = firebase.firestore();

// ---------- 1. BUSINESS SIGNUP — creates Firebase Auth user = ALSO a Ride user ----------
async function businessSignup(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const businessName = document.getElementById('businessName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const businessType = document.getElementById('businessType').value;
  const msg = document.getElementById('msg');
  if(!email || !password || password.length < 6 || !businessName){ msg.className='err'; msg.textContent='Fill Business Name, valid Business Email, password min 6.'; return; }
  msg.textContent = 'Creating Business + Ride account...';
  try{
    // THIS line is the key: same Firebase Auth as Ride. Not a demo, not localStorage.
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const affiliateCode = 'FLT-' + Math.floor(100000 + Math.random()*900000);
    // SAME users/{uid} doc Ride uses — roles include BOTH
    await db.collection('users').doc(uid).set({
      email, phone, businessName, businessType,
      affiliate: true, affiliateCode,
      roles: ['business','customer'],
      walletBalance: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    msg.className='ok'; msg.textContent = '✅ Done! Business account created AND Ride account created. Affiliate Code: '+affiliateCode+'. Login on Ride with SAME email + password — it will work.';
    setTimeout(()=> location.reload(), 1500);
  }catch(e){ msg.className='err'; msg.textContent = e.message; }
}

// ---------- 2. BUSINESS LOGIN — same Firebase Auth as Ride ----------
async function businessLogin(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  try{
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged below will show dashboard — no second signup needed
  }catch(e){ msg.className='err'; msg.textContent = e.message + ' — If you signed up on Business, this same login works on Ride. If it fails here, it means signup did NOT use Firebase Auth.'; }
}

function showAuth(){
  document.getElementById('content').innerHTML = `
    <input id="businessName" placeholder="Business Name *">
    <input id="email" type="email" placeholder="Business Email *">
    <input id="phone" placeholder="Phone / WhatsApp *">
    <input id="password" type="password" placeholder="Password (min 6) *">
    <select id="businessType"><option>Restaurant</option><option>Pharmacy</option><option>Supermarket</option><option>Bakery</option><option>Boutique / Fashion</option><option>Grocery</option><option>Other</option></select>
    <button onclick="businessSignup()">Create Business Account</button>
    <button class="ghost" onclick="businessLogin()">Already have account? Login</button>
    <p id="msg" class="muted">One signup = Business + Ride. Same email + password works on ride.floot.com.ng. No second account.</p>`;
}

// ---------- 3. BUSINESS DASHBOARD — LISTENER ONLY, like Salesforce ----------
function showDashboard(user, me){
  const code = me.affiliateCode || '—';
  document.getElementById('content').innerHTML = `
    <span class="pill">● LIVE LISTENING TO CUSTOMER APP</span>
    <h3 style="margin:10px 0 4px">${me.businessName||''}</h3>
    <p class="muted">Email: <b>${user.email}</b><br>Affiliate Code: <b>${code}</b><br>Wallet: Same as Ride</p>
    <div class="grid">
      <div class="stat"><div class="muted">Commission (3%)</div><b id="comm">₦0</b><div class="muted">Floot 10% • You 3% of fee</div></div>
      <div class="stat"><div class="muted">This Week</div><b id="weekVol">0 parcels</b><div class="muted" id="weekFees"></div></div>
      <div class="stat"><div class="muted">Total Parcels</div><b id="total">0</b></div>
      <div class="stat"><div class="muted">Payout Due</div><b id="payout">₦0</b><div class="muted">Month-end • Min ₦10,000</div></div>
    </div>
    <h3>Live Feed</h3><div id="feed"><p class="muted">Listening to Customer orders...</p></div>
    <p class="muted">Business does NOT book delivery. Customer books on Ride. Business only listens + counts.</p>
    <button class="ghost" onclick="firebase.auth().signOut().then(()=>location.reload())">Logout</button>`;

  // Listener: Customer writes, Business reads
  db.collection('orders').where('affiliateCode','==',code).onSnapshot(qs=>{
    let totalFees=0, total=0, weekCount=0, weekFees=0, rows=[];
    const ws = new Date(); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    qs.forEach(d=>{ const o=d.data(); total++; const fee=Number(o.delivery_fee||o.fee||o.deliveryFee||0); totalFees+=fee;
      const created = o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt||Date.now());
      if(created>=ws){ weekCount++; weekFees+=fee; } rows.push({...o, created}); });
    rows.sort((a,b)=> b.created-a.created);
    const comm = totalFees*0.03;
    document.getElementById('comm').textContent = '₦'+comm.toLocaleString();
    document.getElementById('weekVol').textContent = weekCount+' parcels';
    document.getElementById('weekFees').textContent = '₦'+weekFees.toLocaleString()+' fees this week';
    document.getElementById('total').textContent = total;
    document.getElementById('payout').textContent = '₦'+comm.toLocaleString() + (comm<10000?' • carries over':' • ready');
    document.getElementById('feed').innerHTML = rows.slice(0,20).map(o=>`<div class="row"><b>${o.pickup||'Pickup'} → ${o.dropoff||'Dropoff'}</b><br><span class="muted">${o.created.toLocaleString()} • ${o.status||''} • ${o.type||o.packageType||'Parcel'}</span><br>Fee ₦${Number(o.delivery_fee||o.fee||0).toLocaleString()} • Your 3%: ₦${(Number(o.delivery_fee||o.fee||0)*0.03).toLocaleString()}</div>`).join('') || '<p class="muted">No orders yet for this affiliate code.</p>';
  });
}

// --- FIX: If Firebase config is still placeholder, show error + form immediately ---
const isPlaceholder = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_');
if(isPlaceholder){
  document.getElementById('content').innerHTML = `<p style="color:red"><b>⚠️ CONFIG MISSING:</b> This file still has YOUR_API_KEY_FROM_RIDE_APP as placeholder.<br><br>Copy the REAL firebaseConfig from ride.floot.com.ng (Firebase Console > Project Settings) and paste it at the top of this file. That is why it was stuck on Loading...</p>`;
  // Still show signup form so you can see it, but signup will fail until config is fixed
  setTimeout(showAuth, 500);
}
// --- FIX: Timeout — if onAuthStateChanged hangs > 4s, show form anyway ---
let authResolved = false;
setTimeout(()=>{ if(!authResolved && !isPlaceholder){ console.warn('Auth timed out, showing form'); showAuth(); } }, 4000);

auth.onAuthStateChanged(async (user)=>{
  authResolved = true;
  if(!user){ showAuth(); return; }
  const snap = await db.collection('users').doc(user.uid).get();
  const me = snap.exists ? snap.data() : {};
  // If user signed up on Ride first (customer only), Business can upgrade them — no new account
  if(!me.affiliate){
    document.getElementById('content').innerHTML = `<p>Logged in as <b>${user.email}</b> (Ride account found ✅)</p><p>Turn this Ride account into a Business Affiliate? Same login, no new password.</p><input id="bn" placeholder="Business Name"><button id="go">Become Business Affiliate</button>`;
    document.getElementById('go').onclick = async ()=>{
      await db.collection('users').doc(user.uid).set({ affiliate:true, affiliateCode: me.affiliateCode||('FLT-'+Math.floor(100000+Math.random()*900000)), businessName: document.getElementById('bn').value, roles:['business','customer'] }, {merge:true});
      location.reload();
    };
    return;
  }
  showDashboard(user, me);
});
</script></body></html>
