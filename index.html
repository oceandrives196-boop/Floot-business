<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floot Business — Register</title><style>body{font-family:system-ui;background:#7C3AED;padding:20px} .card{max-width:400px;margin:auto;background:#fff;border-radius:20px;padding:22px} input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #ddd} button{width:100%;padding:14px;background:#7C3AED;color:#fff;border:0;border-radius:12px;font-weight:800} .ok{color:green}.err{color:red}</style></head>
<body><div class="card"><h2>Floot NG — Business</h2><p>One account = Business + Customer. Same email + password works on ride.floot.com.ng</p>
<input id="businessName" placeholder="Business Name"><input id="email" type="email" placeholder="Business Email *"><input id="phone" placeholder="Phone / WhatsApp *"><input id="password" type="password" placeholder="Password (min 6) *"><input id="businessType" placeholder="Business Type e.g. Pharmacy"><input id="location" placeholder="Location e.g. Ikeja">
<button id="btn">Create Business Account</button><p id="msg"></p>
<script type="module">import {flootSignup} from './floot-auth.js';
document.getElementById('btn').onclick=async()=>{ const msg=document.getElementById('msg'); msg.textContent='Creating...';
 try{ const d=await flootSignup({email:email.value,password:password.value,phone:phone.value,fullName:businessName.value,businessName:businessName.value,businessType:businessType.value,location:location.value,app:'business'});
 msg.className='ok'; msg.textContent='✅ Done! Business + Customer accounts created. Roles: '+d.user.roles.join(', ')+'. Now login on Customer app with SAME email + password.'; }
 catch(e){ msg.className='err'; msg.textContent=e.message; } };
</script></div></body></html>
