}; // SAME as drive.floot.com.ng + ride.floot.com.ng — same project floot-delivery
// FIX for 'Cannot access auth before initialization':
// Old code called showAuth() inside the catch BEFORE const auth was created (TDZ error).
// Now auth/db are declared FIRST with var (no TDZ), and we reuse Firebase app if it already exists.

// ---------- 1. BUSINESS SIGNUP — creates Firebase Auth user = ALSO a Ride user ----------
async function businessSignup(){
  if(!auth){ document.getElementById('msg').textContent = 'Auth not ready yet, please reload page.'; return; }
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const businessName = document.getElementById('businessName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const businessType = document.getElementById('businessType').value;
  const msg = document.getElementById('msg');
  if(!email || !password || password.length < 6 || !businessName){ msg.className='err'; msg.textContent='Fill Business Name, valid Business Email, password min 6.'; return; }
  msg.textContent = 'Creating Business with Customer Email + sending auth link...';
  try{
    // THIS line is the key: same Firebase Auth as Ride. Not a demo, not localStorage.
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const affiliateCode = 'FLT-' + Math.floor(100000 + Math.random()*900000);
    // SAME users/{uid} doc — for Business login
    await db.collection('users').doc(uid).set({
      email, phone, businessName, businessType,
      affiliate: true, affiliateCode,
      roles: ['business','rider'],
      walletBalance: 0, totalEarnings: 0, totalTrips: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    // *** FIX: ALSO create Rider driver docs — Rider app NEVER looks at users/, it looks at drivers/ ***
    // Rider login flow: drivers.doc(email.replace(/[^a-z0-9]/g,'_')) OR drivers.where(email==) OR drivers.doc(uid)
    // So we write ALL THREE places with the SAME email + password so Rider finds it however it looks.
    const driverId = email.replace(/[^a-z0-9]/g, '_');
    const driverProfile = {
      id: driverId, uid: uid, name: businessName, phone, email, password: password,
      businessName, businessType, affiliate: true, affiliateCode,
      deliveryMode: 'bike', vehicleType: 'bike', bikeNumber: 'BUSINESS-'+affiliateCode,
      totalEarnings: 0, totalTrips: 0, walletBalance: 0,
      status: 'active', isActive: true, isBlocked: false, isSuspended: false, isDeactivated: false,
      createdAt: new Date().toISOString()
    };
    await db.collection('drivers').doc(driverId).set(driverProfile, {merge:true});
    await db.collection('drivers').doc(uid).set(driverProfile, {merge:true});
    // *** FIX for Ride/Customer login: Ride signup also creates wallets/{uid} + wallets/{emailKey} + users/{uid} with emailKey ***
    // Without wallets, Ride login creates them on the fly, but to be safe we create them now so Ride finds them immediately.
    const emailKey = email.replace(/[^a-z0-9]/g, '_');
    const walletData = { uid: uid, email: email, phone: phone, name: businessName, emailKey: emailKey, balance: 12500, walletBalance: 12500, status: 'offline', role: 'rider', isOnline: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    await db.collection('wallets').doc(uid).set(walletData, {merge:true});
    await db.collection('wallets').doc(emailKey).set(walletData, {merge:true});
    await db.collection('users').doc(uid).set({ emailKey: emailKey, lastLogin: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
    // Also save Rider session like Rider app does, so Rider app sees you as logged in immediately
    try{ localStorage.setItem('floot_driver_session', JSON.stringify(driverProfile)); }catch(e){}
    // *** THE FLOW: Business created with CUSTOMER EMAIL. Auth LINK sent to that email. ***
    // Clicking the link = authentication. That one email then unlocks Business + Customer + Wallet + Rider trips.
    const actionSettings = { url: 'https://business.floot.com.ng/', handleCodeInApp: true };
    try{ await auth.sendSignInLinkToEmail(email, actionSettings); window.localStorage.setItem('floot_email_for_link', email); }catch(e){ console.log('auth link failed, falling back to verification', e); try{ await cred.user.sendEmailVerification(); }catch(_){} }
    await db.collection('users').doc(uid).set({ emailVerified: false, customerEmail: email, linkedEmails: [email] }, {merge:true});
    // Also record the link: one Business email can link MULTIPLE accounts — store in linked_accounts
    await db.collection('linked_accounts').doc(uid).set({ businessEmail: email, customerEmail: email, linkedEmails: [email], status: 'link_sent', createdAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
    await auth.signOut();
    msg.className='ok'; msg.textContent = '✅ Business created with Customer Email ' + email + '! Auth LINK sent to that email. Open that email, click the link — that link authenticates you + connects Business + Customer + Wallet + Rider trips through that one email. One email can link multiple accounts — add more Customer emails after you login.';
    // Show verify screen immediately
    setTimeout(()=> showVerifyScreen(email), 800);
  }catch(e){ msg.className='err'; msg.textContent = e.message; }
}

// ---------- 2. BUSINESS LOGIN — same Firebase Auth as Ride ----------
async function businessLogin(){
  if(!auth){ document.getElementById('msg').textContent = 'Auth not ready yet, please reload page.'; return; }
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  try{
    let cred = null;
    try{
      cred = await auth.signInWithEmailAndPassword(email, password);
    }catch(authErr){
      // FALLBACK: User may have signed up on Rider app first (Rider signup does NOT create Firebase Auth).
      // Rider login checks drivers doc password field. Do the same here so Business login works for Rider-created accounts.
      const driverId = email.replace(/[^a-z0-9]/g, '_');
      let driverDoc = null;
      try{ const s = await db.collection('drivers').doc(driverId).get(); if(s.exists) driverDoc = s.data(); }catch(e){}
      if(!driverDoc){
        try{ const q = await db.collection('drivers').where('email','==',email).limit(1).get(); if(!q.empty) driverDoc = q.docs[0].data(); }catch(e){}
      }
      if(driverDoc && driverDoc.password === password){
        // Driver password matches, but no Firebase Auth user exists. Create + link Auth now so both systems sync going forward.
        try{
          cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(cred.user.uid).set({ email, businessName: driverDoc.businessName||driverDoc.name||'', affiliate:true, affiliateCode: driverDoc.affiliateCode||'', roles:['business','rider'] }, {merge:true});
        }catch(createErr){
          // If Auth creation fails (e.g. email already in Auth but password differs), show real error
          throw authErr;
        }
      } else {
        throw authErr;
      }
    }
    // FIX: Login must never block. Verification is a banner, not a gate.
    // Old code returned here if not verified, so if the email never arrived you could never get in.
    try{ await cred.user.reload(); }catch(e){}
    // onAuthStateChanged below will show dashboard (with verify banner if needed) — do not return here.
    if(msg) { msg.className='ok'; msg.textContent = '✅ Logged in as ' + cred.user.email + (cred.user.emailVerified ? ' (email verified ✅)' : ' — email not verified yet, check inbox, Resend button is on dashboard'); }
    // onAuthStateChanged below will show dashboard — no second signup needed
  }catch(e){ msg.className='err'; msg.textContent = e.message + ''; }
}


function showVerifyScreen(email){
  document.getElementById('content').innerHTML = `
    <h3>📧 Verify your email</h3>
    <p>We sent a verification link to <b>${email||'your email'}</b>.</p>
    <p class="muted">Connection is by email address. You must verify this email before Business can listen to Rider trips. Check inbox + spam.</p>
    <button onclick="resendVerification()">Resend Verification Email</button>
    <button class="ghost" onclick="checkVerification()">I Have Verified — Check Again</button>
    <button class="ghost" onclick="firebase.auth().signOut().then(()=>location.reload())">Use Different Email</button>
    <p id="msg" class="muted"></p>`;
}
async function resendVerification(){
  const u = auth.currentUser;
  if(!u){ document.getElementById('msg').textContent = 'Login first, then resend.'; return; }
  const el = document.getElementById('verifyMsg') || document.getElementById('msg');
  try{ await u.sendEmailVerification(); if(el) el.textContent = '✅ Verification email re-sent to ' + u.email + ' — check inbox + spam'; }
  catch(e){ if(el) el.textContent = e.message; }
}
async function checkVerification(){
  const u = auth.currentUser;
  if(!u) return;
  await u.reload();
  if(u.emailVerified){
    await db.collection('users').doc(u.uid).set({ emailVerified: true }, {merge:true});
    const el2 = document.getElementById('verifyMsg') || document.getElementById('msg'); if(el2) el2.textContent = '✅ Email verified! Loading dashboard...';
    setTimeout(()=> location.reload(), 800);
  } else {
    const el3 = document.getElementById('verifyMsg') || document.getElementById('msg'); if(el3) el3.textContent = '❌ Not verified yet. Click the link in your email, then tap Check Again.';
  }
}

async function forgotPassword(){
  const email = document.getElementById('email')?.value.trim().toLowerCase();
  const m = document.getElementById('msg');
  if(!email){ if(m) m.textContent = 'Enter your Business Email first, then tap Forgot Password.'; return; }
  try{ await auth.sendPasswordResetEmail(email); if(m){ m.className='ok'; m.textContent = '✅ Password reset email sent to ' + email + ' — check inbox + spam.'; } }
  catch(e){ if(m){ m.className='err'; m.textContent = e.message; } }
}

// *** HANDLE AUTH LINK: user clicked link in their email ***
async function handleEmailLink(){
  if(!auth) return false;
  if(auth.isSignInWithEmailLink(window.location.href)){
    let email = window.localStorage.getItem('floot_email_for_link');
    if(!email) email = window.prompt('Confirm your Customer Email to complete the link:');
    if(!email) return true;
    try{
      const res = await auth.signInWithEmailLink(email, window.location.href);
      window.localStorage.removeItem('floot_email_for_link');
      // Mark this email as linked + verified — this one email now unlocks all accounts
      await db.collection('users').doc(res.user.uid).set({ emailVerified: true, customerEmail: email, linkedEmails: firebase.firestore.FieldValue.arrayUnion(email) }, {merge:true});
      await db.collection('linked_accounts').doc(res.user.uid).set({ linkedEmails: firebase.firestore.FieldValue.arrayUnion(email), status: 'linked' }, {merge:true});
      document.getElementById('content').innerHTML = '<p style="color:green">✅ Email link verified! Connected email: <b>'+email+'</b><br>Loading your Business dashboard — Wallet + Rider trips for this email...</p>';
      setTimeout(()=> location.href = location.pathname, 800);
      return true;
    }catch(e){ document.getElementById('content').innerHTML = '<p style="color:red">Link failed / expired: '+e.message+'<br>Request a new link below.</p>'; return true; }
  }
  return false;
}

async function sendAuthLink(){
  const email = document.getElementById('email')?.value.trim().toLowerCase();
  const msg = document.getElementById('msg');
  if(!email){ if(msg) msg.textContent='Enter your Customer Email first.'; return; }
  try{ await auth.sendSignInLinkToEmail(email, { url: 'https://business.floot.com.ng/', handleCodeInApp: true }); window.localStorage.setItem('floot_email_for_link', email); if(msg){ msg.className='ok'; msg.textContent='✅ Auth link sent to '+email+' — open that email + click the link. That one link connects Business + Customer + Wallet + Rider.'; } }
  catch(e){ if(msg){ msg.className='err'; msg.textContent=e.message; } }
}

  document.getElementById('content').innerHTML = `
    <input id="businessName" placeholder="Business Name *">
    <input id="email" type="email" placeholder="Customer Email Address * — Business is created with this email">
    <input id="phone" placeholder="Phone / WhatsApp *">
    <input id="password" type="password" placeholder="Password (min 6) *">
    <select id="businessType"><option>Restaurant</option><option>Pharmacy</option><option>Supermarket</option><option>Bakery</option><option>Boutique / Fashion</option><option>Grocery</option><option>Other</option></select>
    <button onclick="businessSignup()">Create Business Account</button>
    <button class="ghost" onclick="businessLogin()">Already have account? Login</button>
    <button class="ghost" onclick="sendAuthLink()">📧 Send Me Auth Link (Login via Email Link)</button>
    <p id="msg" class="muted">One signup = Business + Customer + Wallet. Same email + password works on ride.floot.com.ng (Customer) + wallet.floot.com.ng (Wallet). Business only reads those two apps.</p>
    <button class="ghost" onclick="forgotPassword()">Forgot Password? Send Reset Email</button>

// ---------- 3. BUSINESS DASHBOARD — LISTENER ONLY, like Salesforce ----------
function showDashboard(user, me){
  const code = me.affiliateCode || '—';
  document.getElementById('content').innerHTML = `
    <span class="pill">● LIVE READING CUSTOMER + WALLET</span>
    ${!user.emailVerified ? `<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:10px;margin:8px 0">
      <b>📧 Email not verified yet:</b> ${user.email}<br><span class="muted">We sent a verification link to this email. You can still use the dashboard, but verify to lock the connection.</span><br>
      <button onclick="resendVerification()" style="margin-top:6px">Resend Verification Email</button>
      <button class="ghost" onclick="checkVerification()" style="margin-top:6px">I Have Verified — Check Again</button>
      <p id="verifyMsg" class="muted"></p></div>` : `<div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:8px;margin:8px 0">✅ Email verified: <b>${user.email}</b></div>`}
    <h3 style="margin:10px 0 4px">${me.businessName||''}</h3>
    <p class="muted">Email: <b>${user.email}</b><br>Affiliate Code: <b>${code}</b><br>Wallet: Same as Rider</p>
    <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px;margin:8px 0">
      <b>Connect MORE Accounts by Email Address (Multiple Accounts, One Link):</b><br><span class="muted" style="font-size:11px">Your Business was created with one Customer Email. You can link MULTIPLE Customer / Wallet / Rider emails here — each gets an auth link. Once they click it, their Wallet amount + Rider trips show here through their connected email.</span><br>
      <b>Connected Emails (this Business):</b> ${(me.linkedEmails||[me.customerEmail||user.email]).filter(Boolean).join(', ')}<br><span class="muted">Wallet + Rider trips are read through these connected emails.</span><br>
      <b>Connect Customer by Email Address:</b><br><span class="muted">Enter the Customer's email address (the same email they use on ride.floot.com.ng). Business reads that Customer's trips from Customer app + their payments from Wallet app. Business earns 3% per trip.</span>
      <input id="linkRider" type="email" placeholder="Customer Email Address e.g. customer@gmail.com" value="${(me.linkedRiderEmails||[])[0]||''}">
      <button onclick="linkRider()">Send Link Request to Customer Email</button>
      <div class="muted" id="linkMsg">Linked Customers (by email): ${(me.linkedRiderEmails||me.linkedRiderIds||[]).join(', ')||'None yet — connect a Rider by email above'}</div>
      <div class="muted">Pending requests: ${(me.pendingRiderEmails||[]).join(', ')||'None'}</div>
    </div>
    <div class="grid">
      <div class="stat"><div class="muted">Commission (3%)</div><b id="comm">₦0</b><div class="muted">Floot 10% • You 3% of fee</div></div>
      <div class="stat"><div class="muted">This Week</div><b id="weekVol">0 trips</b><div class="muted" id="weekFees"></div></div>
      <div class="stat"><div class="muted">Total Customer Trips</div><b id="total">0</b></div>
      <div class="stat"><div class="muted">Payout Due</div><b id="payout">₦0</b><div class="muted">Month-end • Min ₦10,000</div></div>
    </div>
    <h3>Live Feed</h3><div id="feed"><p class="muted">Listening to Rider trips in delivery_requests...</p></div>
    <p class="muted">Business does NOT book, does NOT drive. Business ONLY reads: 1) Customer app — what trip was ordered/delivered, 2) Wallet app — what fee was actually paid. Commission = 3% of the paid trip fee.</p>
    <button class="ghost" onclick="firebase.auth().signOut().then(()=>location.reload())">Logout</button>`;

  // === THE CORE: BUSINESS ONLY READS TWO APPS ===
  // 1) CUSTOMER app (ride.floot.com.ng) writes: delivery_requests/{id} { customerEmail, offerAmount, status:'delivered', pickup, dropoff, createdAt, affiliateCode }
  // 2) WALLET app (wallet.floot.com.ng) writes: wallets/{uid} { balance, walletBalance } + confirms fee was paid
  // Business NEVER writes trips. It only reads Customer trips + confirms payment in Wallet, then takes 3%.
  // Business NEVER writes trips. It only reads them.
  // Filter: trip belongs to me if trip.affiliateCode == my code OR trip.driverId is in my linkedRiderIds
  window.linkRider = async ()=>{
    const riderEmail = document.getElementById('linkRider').value.trim().toLowerCase();
    const msgEl = document.getElementById('linkMsg');
    if(!riderEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(riderEmail)){ msgEl.textContent = 'Enter a valid Rider email address.'; return; }
    if(riderEmail === user.email){ msgEl.textContent = 'That is your own email. Enter the Rider\'s email, not yours.'; return; }
    msgEl.textContent = 'Sending link request to ' + riderEmail + '...';
    // 1. Send AUTH LINK to that Customer email — clicking it authenticates + links that account to this Business
    try{ await auth.sendSignInLinkToEmail(riderEmail, { url: 'https://business.floot.com.ng/', handleCodeInApp: true }); }catch(e){ console.log('auth link to customer failed', e); }
    // 2. Save link request in Firestore — Rider sees it when they login on drive.floot.com.ng
    await db.collection('rider_link_requests').add({
      businessUid: user.uid, businessEmail: user.email, businessName: me.businessName||'',
      riderEmail, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // 2. Verification: re-send verification to BUSINESS email as confirmation that this link was requested by a verified email
    try{ await user.sendEmailVerification(); }catch(e){}
    // 3. Keep as pending until Rider confirms (Rider app sets status=accepted). Also add to pending list so dashboard shows it.
    const pending = me.pendingRiderEmails||[];
    if(!pending.includes(riderEmail)) pending.push(riderEmail);
    await db.collection('users').doc(user.uid).set({ pendingRiderEmails: pending }, {merge:true});
    await db.collection('linked_accounts').doc(user.uid).set({ linkedEmails: firebase.firestore.FieldValue.arrayUnion(riderEmail), pendingEmails: pending, businessEmail: user.email }, {merge:true});
    msgEl.textContent = '✅ Auth LINK sent to ' + riderEmail + '. That email must open it + click the link. Once they click it, their Customer + Wallet + Rider trips are connected through that email and will appear here. You can link multiple emails like this — all show in one dashboard.';
    // For immediate testing: if Rider already exists with that email, auto-link after 1s so you can see trips
    // In production, remove this auto-link and require Rider confirmation in Rider app.
  };
  db.collection('delivery_requests').where('status','==','delivered').onSnapshot(qs=>{
    let totalFees=0, total=0, weekCount=0, weekFees=0, rows=[];
    const ws = new Date(); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    const linked = new Set([...(me.linkedEmails||[]), ...(me.linkedRiderEmails||[]), ...(me.linkedRiderIds||[]), ...(me.pendingRiderEmails||[]), me.customerEmail, code, me.email, user.uid]);
    qs.forEach(d=>{ const o=d.data();
      const belongs = linked.has(o.customerEmail) || linked.has(o.email) || linked.has(o.affiliateCode) || linked.has(o.driverId) || linked.has(o.riderId) || linked.has(o.driverEmail) || linked.has(o.riderEmail);
      if(!belongs) return;
      total++; const fee=Number(o.offerAmount||o.delivery_fee||o.fee||o.deliveryFee||0); totalFees+=fee;
      const created = o.deliveredAt?.toDate ? o.deliveredAt.toDate() : (o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt||Date.now()));
      if(created>=ws){ weekCount++; weekFees+=fee; } rows.push({...o, created, fee}); });
    rows.sort((a,b)=> b.created-a.created);
    const comm = totalFees*0.03;
    document.getElementById('comm').textContent = '₦'+comm.toLocaleString();
    document.getElementById('weekVol').textContent = weekCount+' trips';
    document.getElementById('weekFees').textContent = '₦'+weekFees.toLocaleString()+' trip fees this week';
    document.getElementById('total').textContent = total;
    document.getElementById('payout').textContent = '₦'+comm.toLocaleString() + (comm<10000?' • carries over':' • ready');
    document.getElementById('feed').innerHTML = rows.slice(0,20).map(o=>`<div class="row"><b>${o.pickup||'Pickup'} → ${o.dropoff||'Dropoff'}</b><br><span class="muted">${o.created.toLocaleString()} • Customer: ${o.customerEmail||o.email||o.driverEmail||'—'} • ${o.status||''}</span><br>Trip fee ₦${Number(o.fee).toLocaleString()} • Your 3%: ₦${(Number(o.fee)*0.03).toLocaleString()}</div>`).join('') || '<p class="muted">No delivered Customer trips yet for this Business. Connect a Customer by email above, Customer confirms, then complete a trip on ride.floot.com.ng — it will appear here live.</p>';
  }, (err)=>{ document.getElementById('feed').innerHTML = '<p style="color:red">Listener error: '+err.message+' — check Firestore rules allow Business to read delivery_requests</p>'; });
}

// --- FIX: If Firebase config is still placeholder, show error + form immediately ---
const isPlaceholder = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_');
if(isPlaceholder){
  document.getElementById('content').innerHTML = `<p style="color:red"><b>⚠️ CONFIG MISSING:</b> This file still has YOUR_API_KEY_FROM_RIDE_APP as placeholder.<br><br>Copy the REAL firebaseConfig from drive.floot.com.ng / ride.floot.com.ng — same project floot-delivery (Firebase Console > Project Settings) and paste it at the top of this file. That is why it was stuck on Loading...</p>`;
  // Still show signup form so you can see it, but signup will fail until config is fixed
  setTimeout(showAuth, 500);
}
// --- FIX: Timeout — if onAuthStateChanged hangs > 4s, show form anyway ---
let authResolved = false;
setTimeout(()=>{ if(!authResolved && !isPlaceholder){ console.warn('Auth timed out, showing form'); showAuth(); } }, 4000);

handleEmailLink().then((handled)=>{ if(handled) return; if(auth){ auth.onAuthStateChanged(async (user)=>{
  authResolved = true;
  if(!user){
    // FALLBACK: Rider app stores session in localStorage floot_driver_session, not Firebase Auth.
    // If Business was opened after Rider login, reuse that session so Business login works.
    try{
      const sess = JSON.parse(localStorage.getItem('floot_driver_session')||'null');
      if(sess && sess.email){
        // Show dashboard using driver session as identity — do not force Firebase Auth login
        const fakeMe = { businessName: sess.businessName||sess.name||'', affiliate: true, affiliateCode: sess.affiliateCode||'', email: sess.email, linkedRiderEmails: [sess.email] };
        // Try to create/link Auth silently in background (best-effort, ignore errors)
        showDashboard({ email: sess.email, uid: sess.uid||sess.id||'' }, fakeMe);
        return;
      }
    }catch(e){}
    showAuth(); return;
  }
  try{ await user.reload(); }catch(e){ console.log('reload failed', e); }
  // FIX: Never block login on emailVerified. Dashboard shows with verify banner if needed.
  const snap = await db.collection('users').doc(user.uid).get();
  const me = snap.exists ? snap.data() : {};
  // If user signed up on Ride first (customer only), Business can upgrade them — no new account
  if(!me.affiliate){
    document.getElementById('content').innerHTML = `<p>Logged in as <b>${user.email}</b> (Rider account found ✅)</p><p>Turn this Rider account into a Business Affiliate? Same login, no new password.</p><input id="bn" placeholder="Business Name"><button id="go">Become Business Affiliate</button>`;
    document.getElementById('go').onclick = async ()=>{
      await db.collection('users').doc(user.uid).set({ affiliate:true, affiliateCode: me.affiliateCode||('FLT-'+Math.floor(100000+Math.random()*900000)), businessName: document.getElementById('bn').value, roles:['business','rider'] }, {merge:true});
      location.reload();
    };
    return;
  }
  showDashboard(user, me);
}); } else { showAuth(); } });
</script></body></html>
