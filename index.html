function setFilter(f){ filter=f; startListeners(); }

// ================= BUSINESS LOANS — MONTHLY TARGET BAR =================
// MONTHLY BAR: counts THIS calendar month's delivered trips only. Bar grows per delivery.
// 200 trips -> ₦50k eligible, 1,000 -> ₦100k, 5,000 -> ₦150k, 50,000 -> ₦250k, 1,000,000 -> ₦400k.
// If you don't take it, bar keeps climbing to the next milestone WITHIN the same month.
// At month change, monthRows automatically becomes the new month -> bar resets to 0. No stored state.
// ONLY borrowers keep a second bar: the LOAN-SERVICE bar. It does NOT reset at month end, it lives until repaid.
// If you have ANY unpaid debt (active/pending loan), monthly bar is blocked: finish the loan first.
// ANTI-FAKE (monthly): need many DISTINCT days in the month + real fees paid + commission truly credited.
// No single day can be >25% of the month's trips, so a 1-day burst of fake trips can't unlock it.
// Faking still costs ~97% of fees (you pay fee, only 3% returns as commission).
// PROFIT: 15% flat fee, 70% of each NEW commission repays loan, 30% to wallet. Owner fund pot caps total lending.
const LOAN_MONTH_TIERS=[
  {trips:200, cap:50000, minFees:400000, minDays:15},
  {trips:1000, cap:100000, minFees:2000000, minDays:25},
  {trips:5000, cap:150000, minFees:10000000, minDays:28},
  {trips:50000, cap:250000, minFees:100000000, minDays:29},
  {trips:1000000, cap:400000, minFees:2000000000, minDays:30},
];
const LOAN_FEE_RATE=0.15, LOAN_REPAY_SHARE=0.70;
function monthlyLoanInfo(rows){
  const now=new Date(); const ms=new Date(now.getFullYear(), now.getMonth(), 1);
  const monthRows=rows.filter(r=>r.created>=ms);
  const byDay={}; monthRows.forEach(r=>{ const k=r.created.toDateString(); (byDay[k]=byDay[k]||[]).push(r); });
  const distinctDays=Object.keys(byDay).length;
  const maxDayShare = monthRows.length ? Math.max(...Object.values(byDay).map(l=>l.length))/monthRows.length : 0;
  const totalFees=monthRows.reduce((s,r)=>s+r.fee,0);
  const monthComm=totalFees*0.03;
  let unlocked=null, next=null;
  for(let i=0;i<LOAN_MONTH_TIERS.length;i++){ const cand=LOAN_MONTH_TIERS[i];
    if(monthRows.length>=cand.trips && totalFees>=cand.minFees && distinctDays>=cand.minDays && maxDayShare<=0.25) unlocked=cand; else if(!next) next=cand;
  }
  // Bar progress: toward NEXT milestone (or full if at top tier)
  let barPct=0, barLabel='';
  if(!unlocked){ const first=LOAN_MONTH_TIERS[0]; barPct=Math.min(100, monthRows.length/first.trips*100); barLabel=monthRows.length+' / '+first.trips+' trips to ₦50k'; }
  else if(unlocked.trips===1000000){ barPct=100; barLabel='Top tier reached — ₦400k'; }
  else { const idx=LOAN_MONTH_TIERS.indexOf(unlocked); const nxt=LOAN_MONTH_TIERS[idx+1]; barPct=Math.min(100, (monthRows.length-unlocked.trips)/(nxt.trips-unlocked.trips)*100); barLabel=monthRows.length+' trips • ₦'+unlocked.cap.toLocaleString()+' unlocked • next: '+nxt.trips.toLocaleString()+' trips → ₦'+nxt.cap.toLocaleString(); }
  const monthName=now.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  return { monthRows, monthTrips:monthRows.length, distinctDays, maxDayShare, totalFees, monthComm, unlocked, next, barPct, barLabel, monthName };
}
async function renderLoans(rows){
  const el=document.getElementById('loanBox'); if(!el) return;
  // Active / pending loan? -> ONLY the loan-service bar. Monthly bar is blocked until repaid.
  let active=null; try{ const qs=await db.collection('business_loans').where('email','==',linkedEmail.toLowerCase()).where('status','in',['active','pending']).get(); qs.forEach(d=>{ const v=d.data(); if(v.status==='active'||v.status==='pending') active={id:d.id, ...v}; }); }catch(e){ try{ const qs=await db.collection('business_loans').where('email','==',linkedEmail.toLowerCase()).get(); qs.forEach(d=>{ const v=d.data(); if(v.status==='active'||v.status==='pending') active={id:d.id, ...v}; }); }catch(e2){} }
  window._activeLoan=active;
  if(active){
    const left=Math.max(0, Number(active.repayTotal||0)-Number(active.repaid||0));
    const pct=Math.min(100, (Number(active.repaid||0)/Math.max(1,Number(active.repayTotal||0)))*100);
    el.innerHTML=`<b>${active.status==='pending'?'⏳ Loan Request Pending — Owner Review':'💰 Loan To Service — Does NOT Reset'}</b><div class="muted">Borrowed ${naira(active.amount)} • Repay total ${naira(active.repayTotal)} (incl. 15% fee) • Repaid ${naira(active.repaid||0)} • Left ${naira(left)}</div><div class="bar"><div style="width:${pct}%"></div></div><div class="muted">${pct.toFixed(0)}% repaid • 70% of each new commission (this month AND next months) repays this loan. Monthly target bar is paused until this is fully repaid — no new loan while you owe.</div>`;
    return;
  }
  // No debt: monthly target bar
  const info=monthlyLoanInfo(rows); window._loanInfo=info;
  // Proven-money cap: never lend more than 25% of commission truly credited (markers)
  let credited=0; try{ const qs=await db.collection('business_commissions').where('email','==',linkedEmail.toLowerCase()).get(); qs.forEach(d=>{ credited+=Number(d.data().commission||0); }); }catch(e){}
  const provenCap=Math.floor(credited*0.25);
  let fund=0; try{ const f=await db.collection('loan_fund').doc('main').get(); if(f.exists) fund=Number(f.data().available||0); }catch(e){}
  window._loanFund=fund; window._provenCap=provenCap;
  const monthLabel=`<b>🎯 ${info.monthName} Target Bar</b><div class="muted">${info.monthTrips} deliveries this month • ${info.distinctDays} active days • Fees ${naira(info.totalFees)} • Commission ${naira(info.monthComm)}</div><div class="bar"><div style="width:${info.barPct}%"></div></div><div class="muted">${info.barLabel}</div><div class="muted">Resets on the 1st. If you don't take it, it keeps climbing to the next milestone this month.</div>`;
  if(!info.unlocked){
    el.innerHTML=monthLabel+`<div class="muted" style="margin-top:8px">Next unlock: 200 trips in one month (15+ active days, ₦400k+ fees, no single day &gt;25% of trips) → ₦50k loan.</div>`;
    return;
  }
  const maxLoan=Math.min(info.unlocked.cap, provenCap, fund>0?fund:info.unlocked.cap);
  if(maxLoan<10000){ el.innerHTML=monthLabel+`<div class="muted" style="margin-top:8px">Trips unlocked ₦${info.unlocked.cap.toLocaleString()}, but proven commission credited is only ${naira(credited)} — loan is capped at 25% of proven commission (${naira(provenCap)}). Keep doing real trips, the cap grows.</div>`; return; }
  el.innerHTML=monthLabel+`<div class="muted" style="margin-top:8px">✅ <b>₦${maxLoan.toLocaleString()} available this month</b> • Repay ${naira(Math.round(maxLoan*1.15))} (15% fee) • 70% of each future commission repays it. ${fund>0?`Owner fund: ${naira(fund)}`:''}</div><input id="loanAmount" type="number" min="10000" max="${maxLoan}" step="1000" value="${Math.min(50000,maxLoan)}"><button onclick="requestLoan()">Take This Month's Loan</button><p id="loanMsg" class="muted"></p>`;
}
async function requestLoan(){
  const msg=document.getElementById('loanMsg'); const info=window._loanInfo||{}; const maxLoan=Math.min(info.unlocked?info.unlocked.cap:0, window._provenCap||0, window._loanFund>0?window._loanFund:Infinity);
  const amt=Math.floor(Number(document.getElementById('loanAmount')?.value||0));
  if(window._activeLoan){ msg.className='err'; msg.textContent='You already have a loan to service. Finish it first.'; return; }
  if(!amt || amt<10000 || amt>maxLoan){ msg.className='err'; msg.textContent='Amount must be ₦10,000 – '+naira(maxLoan)+' this month.'; return; }
  msg.textContent='Taking loan… reserving from owner fund in one transaction…';
  try{
    const fundRef=db.collection('loan_fund').doc('main'); const loanRef=db.collection('business_loans').doc();
    await db.runTransaction(async (tx)=>{
      const fundSnap=await tx.get(fundRef); const avail=fundSnap.exists?Number(fundSnap.data().available||0):0;
      if(avail<amt) throw new Error('Owner loan fund has only '+naira(avail)+' available. Saved as pending.');
      tx.set(fundRef, {available: avail-amt, totalLent: firebase.firestore.FieldValue.increment(amt), updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
      tx.set(loanRef, {email:linkedEmail.toLowerCase(), emailKey:emailKeyOf(linkedEmail), amount:amt, feeRate:LOAN_FEE_RATE, repayTotal:Math.round(amt*1.15), repaid:0, status:'active', month: new Date().toISOString().slice(0,7), createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      tx.set(db.collection('drivers').doc(emailKeyOf(linkedEmail)), {email:linkedEmail.toLowerCase(), walletBalance:firebase.firestore.FieldValue.increment(amt)}, {merge:true});
      tx.set(db.collection('wallets').doc(emailKeyOf(linkedEmail)), {email:linkedEmail.toLowerCase(), balance:firebase.firestore.FieldValue.increment(amt), totalLoansReceived:firebase.firestore.FieldValue.increment(amt)}, {merge:true});
      tx.set(db.collection('wallets').doc(emailKeyOf(linkedEmail)).collection('transactions').doc(loanRef.id+'_loan'), {amount:amt, type:'business_loan', reason:'Business loan disbursed — repay ' + naira(Math.round(amt*1.15)), createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    msg.className='ok'; msg.textContent='✅ ₦'+amt.toLocaleString()+' disbursed to your wallet. Repay total '+naira(Math.round(amt*1.15))+'. Your loan-service bar will stay until it is fully repaid.';
    setTimeout(()=>renderLoans(window._lastRows||[]), 800);
  }catch(e){
    try{ await db.collection('business_loans').add({email:linkedEmail.toLowerCase(), emailKey:emailKeyOf(linkedEmail), amount:amt, feeRate:LOAN_FEE_RATE, repayTotal:Math.round(amt*1.15), repaid:0, status:'pending', month:new Date().toISOString().slice(0,7), createdAt:firebase.firestore.FieldValue.serverTimestamp(), pendingReason:e.message}); msg.className='err'; msg.textContent='Saved as pending: '+e.message; }catch(e2){ msg.className='err'; msg.textContent=e.message; }
  }
}
async function autoCreditCommissions(rows){
  for(const r of rows){
    const comm = Math.round((Number(r.fee||0)*0.03)*100)/100;
    if(!r.tripId || !(comm>0)) continue;
    if(window._creditedTrips && window._creditedTrips.has(r.tripId)) continue;
    const markerRef = db.collection('business_commissions').doc(r.tripId+'_'+emailKeyOf(linkedEmail));
    try{
      const result = await db.runTransaction(async (tx)=>{
        const snap = await tx.get(markerRef); if(snap.exists) return {already:true};
        let loan=null, repayPart=0, walletPart=comm;
        const loanQs = await tx.get(db.collection('business_loans').where('email','==',linkedEmail.toLowerCase()).where('status','==','active').limit(1));
        if(!loanQs.empty){ const ld=loanQs.docs[0]; const v=ld.data(); const left=Math.max(0, Number(v.repayTotal||0)-Number(v.repaid||0)); repayPart=Math.min(Math.round(comm*LOAN_REPAY_SHARE*100)/100, left); walletPart=Math.round((comm-repayPart)*100)/100; loan={ref:ld.ref, repayPart}; }
        tx.set(markerRef, { tripId:r.tripId, email:linkedEmail.toLowerCase(), emailKey:emailKeyOf(linkedEmail), fee:Number(r.fee||0), commission:comm, walletPart, loanRepayPart:repayPart, creditedAt:firebase.firestore.FieldValue.serverTimestamp(), status:'credited' });
        if(walletPart>0){
          tx.set(db.collection('drivers').doc(emailKeyOf(linkedEmail)), { email:linkedEmail.toLowerCase(), walletBalance:firebase.firestore.FieldValue.increment(walletPart), updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
          tx.set(db.collection('wallets').doc(emailKeyOf(linkedEmail)), { email:linkedEmail.toLowerCase(), balance:firebase.firestore.FieldValue.increment(walletPart), totalBusinessCommission:firebase.firestore.FieldValue.increment(walletPart), updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
        }
        if(loan && repayPart>0){
          tx.update(loan.ref, { repaid: firebase.firestore.FieldValue.increment(repayPart), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          tx.set(db.collection('wallets').doc(emailKeyOf(linkedEmail)).collection('transactions').doc(r.tripId+'_loanrepay'), { amount:repayPart, type:'loan_repayment', reason:'70% of 3% commission — trip '+r.tripId, tripId:r.tripId, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        }
        tx.set(db.collection('wallets').doc(emailKeyOf(linkedEmail)).collection('transactions').doc(r.tripId+'_biz3'), { amount:comm, type:'business_commission', reason:'3% business commission — trip '+r.tripId+(repayPart>0?(' • '+naira(repayPart)+' to loan'):''), tripId:r.tripId, email:linkedEmail.toLowerCase(), createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        return {already:false, walletPart, repayPart};
      });
      if(!window._creditedTrips) window._creditedTrips = new Set();
      window._creditedTrips.add(r.tripId);
      if(!result.already){ const el=document.getElementById('creditStatus'); if(el) el.textContent='✓ '+naira(result.walletPart)+' to wallet'+(result.repayPart>0?' • '+naira(result.repayPart)+' to loan':'')+' for trip '+r.tripId.slice(0,8)+'…'; }
    }catch(e){ console.log('auto-credit skipped/failed for', r.tripId, e.message); }
  }
  try{ const qs=await db.collection('business_loans').where('email','==',linkedEmail.toLowerCase()).where('status','==','active').get(); qs.forEach(async d=>{ const v=d.data(); if(Number(v.repaid||0)>=Number(v.repayTotal||0) && Number(v.repayTotal||0)>0){ await d.ref.update({status:'repaid', repaidAt:firebase.firestore.FieldValue.serverTimestamp()}); } }); }catch(e){}
}

function startListeners(){
  if(!linkedEmail) return;
  const ek=emailKeyOf(linkedEmail);
  // 1. WALLET BALANCE — mirrors Wallet app: drivers.walletBalance if driver doc exists, else wallets.balance. NEVER wallets.walletBalance.
  var _driverBal=null, _walletBal=null, _walletBonus=0;
  function renderWalletBal(){
    const main = (_driverBal!==null) ? _driverBal : (_walletBal!==null ? _walletBal : 0);
    const el=document.getElementById('bal'); if(el) el.textContent=naira(main);
    const sub=document.getElementById('balSub'); if(sub) sub.textContent='Main Balance (as in Wallet app) • Bonus ₦'+Number(_walletBonus||0).toLocaleString()+' separate';
    window._walletMainBalance = main;
  }
  db.collection('drivers').doc(ek).onSnapshot(s=>{ _driverBal = s.exists ? Number(s.data().walletBalance||0) : null; renderWalletBal(); });
  db.collection('drivers').where('email','==',linkedEmail.toLowerCase()).limit(1).onSnapshot(q=>{ if(!q.empty){ _driverBal=Number(q.docs[0].data().walletBalance||0); renderWalletBal(); } });
  db.collection('wallets').doc(ek).onSnapshot(s=>{ if(s.exists){ _walletBal=Number(s.data().balance||0); _walletBonus=Number(s.data().bonus||s.data().bonusBalance||0); } renderWalletBal(); });
  db.collection('wallets').where('email','==',linkedEmail.toLowerCase()).limit(1).onSnapshot(q=>{ if(!q.empty){ _walletBal=Number(q.docs[0].data().balance||0); _walletBonus=Number(q.docs[0].data().bonus||q.docs[0].data().bonusBalance||0); renderWalletBal(); } });
    // 2. TRIP HISTORY for this ONE linked email — from Customer + Rider trips
  db.collection('delivery_requests').onSnapshot(qs=>{
    let rows=[];
    qs.forEach(doc=>{ const o=doc.data();
      const emails=[o.customerEmail,o.email,o.customer_email].filter(Boolean).map(x=>String(x).toLowerCase()); // customer/login email only — never rider/driver emails
      if(!emails.includes(linkedEmail.toLowerCase())) return; // ONLY the login email — no affiliate-code / other-email trips
      if(o.status && !['delivered','completed','done'].includes(String(o.status).toLowerCase())) return;
      const fee=Number(o.offerAmount??o.delivery_fee??o.fee??o.deliveryFee??o.amount??0);
      const created=o.deliveredAt?.toDate?o.deliveredAt.toDate():(o.createdAt?.toDate?o.createdAt.toDate():new Date(o.createdAt||Date.now()));
      rows.push({...o,fee,created,tripId:doc.id});
    });
    // Filter by delivery mode
    if(filter!=='all'){ rows=rows.filter(o=>{ const m=String(o.deliveryMode||o.vehicleType||o.type||'bike').toLowerCase(); if(filter==='transit') return m.includes('transit')||m.includes('walker')||m.includes('walk'); return m.includes(filter); }); }
    rows.sort((a,b)=>b.created-a.created);
    const totalFees=rows.reduce((s,r)=>s+r.fee,0);
    const comm=totalFees*0.03;
    window._lastRows=rows; autoCreditCommissions(rows); renderLoans(rows);
    const now=new Date(); const ws=new Date(now); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    const ms=new Date(now.getFullYear(),now.getMonth(),1);
    const weekRows=rows.filter(r=>r.created>=ws); const monthRows=rows.filter(r=>r.created>=ms);
    const weekFees=weekRows.reduce((s,r)=>s+r.fee,0); const monthFees=monthRows.reduce((s,r)=>s+r.fee,0);
    document.getElementById('comm').textContent=naira(comm);
    document.getElementById('commSub').textContent='3% of '+naira(totalFees)+' total fees';
    document.getElementById('totalTrips').textContent=rows.length;
    document.getElementById('tripsSub').textContent=naira(totalFees)+' total fees';
    document.getElementById('weekTrips').textContent=weekRows.length+' trips'; document.getElementById('weekFees').textContent=naira(weekFees)+' fees';
    document.getElementById('monthTrips').textContent=monthRows.length+' trips'; document.getElementById('monthFees').textContent=naira(monthFees)+' fees • Comm '+naira(monthFees*0.03);
    document.getElementById('avgFee').textContent=rows.length?naira(totalFees/rows.length):'₦0';
    document.getElementById('payout').textContent=naira(comm)+' • auto-credited';
    // Top route
    const routeCount={}; rows.forEach(r=>{ const k=(r.pickup||'?')+' → '+(r.dropoff||'?'); routeCount[k]=(routeCount[k]||0)+1; });
    const top=Object.entries(routeCount).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('topRoute').textContent=top?top[0]+' ('+top[1]+'×)':'—';
    document.getElementById('histEmail').textContent=linkedEmail;
    document.getElementById('summary').textContent='For '+linkedEmail+': '+rows.length+' delivered trips, '+naira(totalFees)+' in trip fees, '+naira(comm)+' earned at 3%. Wallet balance shown above is for this same email.';
    document.getElementById('commBar').style.width='100%';
    document.getElementById('commBarLabel').textContent=naira(comm)+' commission • auto-credited per trip';
    const byDay={}; rows.forEach(r=>{ const k=r.created.toDateString(); (byDay[k]=byDay[k]||[]).push(r); });
    const days=Object.entries(byDay).sort((a,b)=>new Date(b[0])-new Date(a[0]));
    window._dailyByDay=byDay;
    document.getElementById('dailyEarnings').innerHTML = days.map(([d,list])=>{ const fees=list.reduce((s,r)=>s+r.fee,0); return `<div class="row" onclick="showDayBreakdown('${d}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>${new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b><span class="pill">${list.length} trips</span></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Fees: <b>${naira(fees)}</b></span><span style="color:#059669">Your 3%: <b>${naira(fees*0.03)}</b></span></div><div class="muted" style="margin-top:4px">Tap for breakdown ↓</div></div>`; }).join('') || '<p class="muted">No earnings yet for '+linkedEmail+'.</p>';
    document.getElementById('feed').innerHTML = rows.slice(0,50).map(o=>`<div class="row"><div style="display:flex;justify-content:space-between"><b>${o.pickup||'Pickup'} → ${o.dropoff||'Dropoff'}</b>${badgeFor(o)}</div><div class="muted">${o.created.toLocaleString()} • ${o.status||'delivered'} • Rider: —</div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Trip Fee: <b>${naira(o.fee)}</b></span><span style="color:#059669">Your 3%: <b>${naira(o.fee*0.03)}</b></span></div></div>`).join('') || '<p class="muted">No delivered trips yet for '+linkedEmail+'. Complete a trip with this email on Customer / Rider app — it will appear here live.</p>';
  });
}
handleLink().then(handled=>{ if(handled) return; auth.onAuthStateChanged(async user=>{ if(!user){ showAuth(); return; } const snap=await db.collection('users').doc(user.uid).get(); const me=snap.exists?snap.data():{}; if(!me.affiliate && !me.businessName){ document.getElementById('content').innerHTML='<p>Logged in as <b>'+user.email+'</b></p><p>Turn this into a Business?</p><input id="bn" placeholder="Business Name"><button id="go">Become Business</button>'; document.getElementById('go').onclick=async()=>{ await db.collection('users').doc(user.uid).set({affiliate:true,affiliateCode:me.affiliateCode||('FLT-'+Math.floor(100000+Math.random()*900000)),businessName:document.getElementById('bn').value,customerEmail:user.email,linkedEmail:user.email,roles:['business','customer']},{merge:true}); location.reload(); }; return; } showDashboard(user,me); }); });
