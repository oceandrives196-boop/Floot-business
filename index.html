<style>

.hero-card span{font-size:11px;color:#EDE9FE}
.body{padding:16px}
.section{margin:16px 0 8px} .section h3{margin:0;font-size:15px} .section p{margin:4px 0;color:#6B7280;font-size:12px}
input,button,select{width:100%;padding:13px;margin:6px 0;border-radius:14px;border:1px solid #E5E7EB;font-size:14px;outline:none}
input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px #EDE9FE}
button{background:#7C3AED;color:#fff;border:0;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.25)}

<body><div class="card" id="app">
<div class="hero"><h2>FLOOT NG — Business</h2><p>History of one linked email • Balance • Trips • 3% Commission</p></div><div class="body">
<div id="content">Loading...</div></div></div><script>
// SAME project as Customer + Wallet + Rider
const firebaseConfig={apiKey:"AIzaSyBVIJq5napb_egiLdKhGtySZoPeLUkY9Q4",authDomain:"floot-delivery.firebaseapp.com",projectId:"floot-delivery",storageBucket:"floot-delivery.firebasestorage.app",messagingSenderId:"786230599434",appId:"1:786230599434:web:e1913bd8c2e69a7e1c64f3"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(); var db=firebase.firestore();
var currentUser=null, businessMe={}, linkedEmail="", filter="all";

function emailKeyOf(email){ return email.toLowerCase().replace(/[^a-z0-9]/g,'_'); }
function naira(n){ return '₦'+Number(n||0).toLocaleString(); }
function badgeFor(o){
  const m=(o.deliveryMode||o.vehicleType||o.type||'bike').toLowerCase();
  if(m.includes('bicycle')) return '<span class="delivery-badge badge-bicycle">🚲 BICYCLE</span>';
  if(m.includes('transit')||m.includes('walker')||m.includes('walk')) return '<span class="delivery-badge badge-transit">🚶 WALKER • TRANSIT</span>';
  return '<span class="delivery-badge badge-bike">🏍️ BIKE</span>';
}

function showAuth(){
  document.getElementById('content').innerHTML = `
  <div class="section"><h3>Welcome back</h3><p>Sign in with your linked Customer Email</p></div><div class="tabs"><button onclick="showAuth()">Sign In</button><button class="ghost" onclick="showSignup()">Create Business Account</button></div>
  <p class="muted">Business account is created with a <b>Customer Email</b>. A link is sent to that email for authentication. That one linked email is what Business reads.</p>
  <input id="email" type="email" placeholder="Your Email Address * — you will only see this email's history">
  <input id="password" type="password" placeholder="Password *">
  <button onclick="doLogin()">Sign In</button>
  <button class="ghost" onclick="sendAuthLink()">📧 Send Auth Link to This Email</button>
  <button class="ghost" onclick="forgot()">Forgot Password?</button>
  <p id="msg" class="muted"></p>`;
}
function showSignup(){
  document.getElementById('content').innerHTML = `
  <h3>Create Business Account</h3>
  <p class="muted">Business is created with YOUR email. Link is sent to YOUR email to authenticate. You will only ever see YOUR email's history.</p>
  <input id="bname" placeholder="Business Name *">
  <input id="email" type="email" placeholder="Your Email Address * — you will only see this email's history">
  <input id="phone" placeholder="Phone / WhatsApp *">
  <input id="password" type="password" placeholder="Password (min 6) *">
  <button onclick="doSignup()">Create Business Account + Send Link</button>
  <button class="ghost" onclick="showAuth()">Already have account? Sign In</button>
  <p id="msg" class="muted"></p>`;
}
async function sendAuthLink(){
  const email=document.getElementById('email')?.value.trim().toLowerCase();
  const msg=document.getElementById('msg'); if(!email){ msg.textContent='Enter Customer Email first.'; return; }
  try{ await auth.sendSignInLinkToEmail(email,{url:'https://business.floot.com.ng/',handleCodeInApp:true}); localStorage.setItem('floot_email_for_link',email); msg.className='ok'; msg.textContent='✅ Auth link sent to '+email+' — open that email + click the link.'; }
  catch(e){ msg.className='err'; msg.textContent=e.message; }
}
async function forgot(){
  const email=document.getElementById('email')?.value.trim().toLowerCase();
  const msg=document.getElementById('msg'); if(!email){ msg.textContent='Enter email first.'; return; }
  try{ await auth.sendPasswordResetEmail(email); msg.className='ok'; msg.textContent='✅ Reset email sent to '+email; }catch(e){ msg.className='err'; msg.textContent=e.message; }
}
async function doSignup(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const bname=document.getElementById('bname').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const msg=document.getElementById('msg');
  if(!email||!password||password.length<6||!bname){ msg.className='err'; msg.textContent='Fill Business Name, Customer Email, password min 6.'; return; }
  msg.textContent='Creating Business with Customer Email + sending link...';
  try{
    let cred; try{ cred=await auth.createUserWithEmailAndPassword(email,password); }
    catch(e){ if(e.code==='auth/email-already-in-use'){ msg.textContent='Email already exists — tap Sign In or Send Auth Link.'; return; } throw e; }
    const uid=cred.user.uid; const code='FLT-'+Math.floor(100000+Math.random()*900000);
    const ek=emailKeyOf(email);
    await db.collection('users').doc(uid).set({email,phone,businessName:bname,customerEmail:email,linkedEmail:email,linkedEmails:[email],affiliate:true,affiliateCode:code,roles:['business','customer'],emailKey:ek,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    await db.collection('wallets').doc(uid).set({uid,email,name:bname,emailKey:ek,balance:0,walletBalance:0},{merge:true});
    await db.collection('wallets').doc(ek).set({uid,email,name:bname,emailKey:ek,balance:0,walletBalance:0},{merge:true});
    await db.collection('linked_accounts').doc(uid).set({businessEmail:email,customerEmail:email,linkedEmail:email,linkedEmails:[email],status:'link_sent',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    try{ await auth.sendSignInLinkToEmail(email,{url:'https://business.floot.com.ng/',handleCodeInApp:true}); localStorage.setItem('floot_email_for_link',email); }catch(e){}
    try{ await cred.user.sendEmailVerification(); }catch(e){}
    msg.className='ok'; msg.textContent='✅ Business created with '+email+'. Auth link sent to that email — open it + click the link to authenticate.';
  }catch(e){ msg.className='err'; msg.textContent=e.message; }
}
async function doLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  try{ await auth.signInWithEmailAndPassword(email,password); }
  catch(e){ msg.className='err'; msg.textContent='Login failed: '+e.message; }
}

// Handle auth link click
async function handleLink(){
  if(auth.isSignInWithEmailLink(window.location.href)){
    let email=localStorage.getItem('floot_email_for_link')||window.prompt('Confirm your Customer Email to complete the link:');
    if(!email) return true;
    try{ const r=await auth.signInWithEmailLink(email,window.location.href); localStorage.removeItem('floot_email_for_link');
      await db.collection('users').doc(r.user.uid).set({emailVerified:true,linkedEmail:email,linkedEmails:firebase.firestore.FieldValue.arrayUnion(email)},{merge:true});
      document.getElementById('content').innerHTML='<p class="ok">✅ Link verified for '+email+'. Loading dashboard...</p>'; setTimeout(()=>location.href=location.pathname,800); return true;
    }catch(e){ document.getElementById('content').innerHTML='<p class="err">Link failed: '+e.message+'</p>'; return true; }
  } return false;
}

function showDashboard(user, me){
  currentUser=user; businessMe=me;
  // FIX: Business shows ONLY the email you logged in with. No other email, ever.
  // Old bug: linkedEmail was saved from a previous input (jacksonjacob614@gmail.com) and kept showing that person's trips even when logged in as azk8zko@clockemail.com.
  // ONLY email used in login — no field to add another email.
  linkedEmail = user.email.toLowerCase();
  document.getElementById('content').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">● BUSINESS • LINKED EMAIL ONLY</span><span class="chip">✅ Verified</span></div>
  <h3 style="margin:10px 0 2px">${me.businessName||'My Business'}</h3>
  <p class="muted">Business Email: <b>${user.email}</b><br>Affiliate: <b>${me.affiliateCode||'—'}</b> • <span class="ok">✅ Authenticated via email link</span></p>
  <div style="background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border-radius:16px;padding:14px;margin:10px 0">
    <small style="color:#DDD6FE;letter-spacing:.6px;text-transform:uppercase;font-size:11px">Your Login Email • Everything below is for YOUR email only</small>
    <div style="font-weight:800;font-size:16px;margin-top:4px;word-break:break-all">${linkedEmail}</div>
    <div style="font-size:12px;color:#EDE9FE;margin-top:4px">Balance + Trips + 3% Commission • Live</div>
  </div>
  <div class="link-box">
    <b>Your Email — history for this email only:</b>
    <div style="background:#fff;border:1px solid #EDE9FE;border-radius:12px;padding:10px;margin-top:6px"><b>🔒 History for your login email only:</b><br><span style="word-break:break-all">${linkedEmail}</span></div>
  </div>
  <div class="tabs" style="margin-top:10px">
    <button onclick="setFilter('all')">All Trips</button><button class="ghost" onclick="setFilter('bike')">Bike</button><button class="ghost" onclick="setFilter('bicycle')">Bicycle</button><button class="ghost" onclick="setFilter('transit')">Walker / Transit</button>
  </div>
  <div class="grid" style="margin-top:10px">
    <div class="stat green"><div class="muted">Wallet Balance<br><span style="font-size:11px">for ${linkedEmail}</span></div><b id="bal">₦0</b><div class="muted" id="balSub">from Wallet app</div></div>
    <div class="stat"><div class="muted">Commission Earned (3%)</div><b id="comm">₦0</b><div class="muted" id="commSub">3% of trip fees</div></div>
    <div class="stat"><div class="muted">Total Trips</div><b id="totalTrips">0</b><div class="muted" id="tripsSub"></div></div>
    <div class="stat amber"><div class="muted">Payout Due</div><b id="payout">₦0</b><div class="muted">Month-end • Min ₦10,000</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
    <div class="stat"><div class="muted">This Week</div><b id="weekTrips">0 trips</b><div class="muted" id="weekFees"></div></div>
    <div class="stat"><div class="muted">This Month</div><b id="monthTrips">0 trips</b><div class="muted" id="monthFees"></div></div>
    <div class="stat"><div class="muted">Avg Trip Fee</div><b id="avgFee">₦0</b></div>
    <div class="stat"><div class="muted">Best Month / Top Route</div><b id="topRoute" style="font-size:13px">—</b></div>
  </div>
  <h3 style="margin:16px 0 6px">Trip History — <span id="histEmail">${linkedEmail}</span></h3>
  <div id="feed"><p class="muted">Loading history for this email...</p></div>
  <div class="summary" style="margin-top:10px">
    <b>Business Summary</b><div class="muted" id="summary">—</div>
    <div class="bar"><div id="commBar" style="width:0%"></div></div>
    <div class="muted" id="commBarLabel"></div>
  </div>
  <button class="ghost" onclick="auth.signOut().then(()=>location.reload())">Logout</button>`;
  startListeners();
}
async function switchLinkedEmail(){ return; } // field removed — login email only async function changeLinkedEmail(){ alert('Locked: Business can only show history for the email you logged in with. Logout and login with a different email to see that email\'s history.'); return; /* LOCKED — no changing email to view others */ 
  if(false){
  const v=''; // field removed — login email only
  if(!v||!v.includes('@')) return alert('Enter a valid linked email');
  // Send auth link to the new email to authenticate it before showing its history
  try{ await auth.sendSignInLinkToEmail(v,{url:'https://business.floot.com.ng/',handleCodeInApp:true}); localStorage.setItem('floot_email_for_link',v); alert('Auth link sent to '+v+' — that email must click it to authenticate. After they click it, their history will show.'); }catch(e){}
  await db.collection('users').doc(currentUser.uid).set({linkedEmail:v,linkedEmails:firebase.firestore.FieldValue.arrayUnion(v)},{merge:true});
  await db.collection('linked_accounts').doc(currentUser.uid).set({linkedEmail:v,linkedEmails:firebase.firestore.FieldValue.arrayUnion(v)},{merge:true});
  location.reload();
}
function setFilter(f){ filter=f; startListeners(); }
function startListeners(){
  if(!linkedEmail) return;
  const ek=emailKeyOf(linkedEmail);
  // 1. WALLET BALANCE for this ONE linked email — from Wallet app
  db.collection('wallets').doc(ek).onSnapshot(s=>{ const d=s.exists?s.data():{}; const bal=Number(d.walletBalance??d.balance??0); document.getElementById('bal').textContent=naira(bal); document.getElementById('balSub').textContent='Wallet • '+(d.name||linkedEmail); });
  // Wallet: ONLY for logged-in email's emailKey. Do NOT fall back to uid wallet if it belongs to a different email.
  // (Removed old uid-wallet fallback that could show another email's balance)
  // 2. TRIP HISTORY for this ONE linked email — from Customer + Rider trips
  db.collection('delivery_requests').onSnapshot(qs=>{
    let rows=[];
    qs.forEach(doc=>{ const o=doc.data();
      const emails=[o.customerEmail,o.email,o.driverEmail,o.riderEmail,o.customer_email].filter(Boolean).map(x=>String(x).toLowerCase());
      // STRICT: only trips where the trip email == logged-in email. No affiliateCode fallback — that fallback was pulling other people's trips.
      if(!emails.includes(linkedEmail.toLowerCase())) return;
      if(o.status && !['delivered','completed','done'].includes(String(o.status).toLowerCase())) return;
      const fee=Number(o.offerAmount??o.delivery_fee??o.fee??o.deliveryFee??o.amount??0);
      const created=o.deliveredAt?.toDate?o.deliveredAt.toDate():(o.createdAt?.toDate?o.createdAt.toDate():new Date(o.createdAt||Date.now()));
      rows.push({...o,fee,created});
    });
    // Filter by delivery mode
    if(filter!=='all'){ rows=rows.filter(o=>{ const m=String(o.deliveryMode||o.vehicleType||o.type||'bike').toLowerCase(); if(filter==='transit') return m.includes('transit')||m.includes('walker')||m.includes('walk'); return m.includes(filter); }); }
    rows.sort((a,b)=>b.created-a.created);
    const totalFees=rows.reduce((s,r)=>s+r.fee,0);
    const comm=totalFees*0.03;
    const now=new Date(); const ws=new Date(now); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    const ms=new Date(now.getFullYear(),now.getMonth(),1);
    const weekRows=rows.filter(r=>r.created>=ws); const monthRows=rows.filter(r=>r.created>=ms);
    const weekFees=weekRows.reduce((s,r)=>s+r.fee,0); const monthFees=monthRows.reduce((s,r)=>s+r.fee,0);
    document.getElementById('comm').textContent=naira(comm);
    document.getElementById('commSub').textContent='3% of '+naira(totalFees)+' total fees';
    document.getElementById('totalTrips').textContent=rows.length;
    document.getElementById('tripsSub').textContent=naira(totalFees)+' total fees';
    document.getElementById('weekTrips').textContent=weekRows.length+' trips'; document.getElementById('weekFees').textContent=naira(weekFees)+' fees';
    document.getElementById('monthTrips').textContent=monthRows.length+' trips'; document.getElementById('monthFees').textContent=naira(monthFees)+' fees • Comm '+naira(monthFees*0.03);
    document.getElementById('avgFee').textContent=rows.length?naira(totalFees/rows.length):'₦0';
    document.getElementById('payout').textContent=naira(comm)+(comm<10000?' • carries over':' • ready');
    // Top route
    const routeCount={}; rows.forEach(r=>{ const k=(r.pickup||'?')+' → '+(r.dropoff||'?'); routeCount[k]=(routeCount[k]||0)+1; });
    const top=Object.entries(routeCount).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('topRoute').textContent=top?top[0]+' ('+top[1]+'×)':'—';
    document.getElementById('histEmail').textContent=linkedEmail;
    document.getElementById('summary').textContent='For '+linkedEmail+': '+rows.length+' delivered trips, '+naira(totalFees)+' in trip fees, '+naira(comm)+' earned at 3%. Wallet balance shown above is for this same email.';
    document.getElementById('commBar').style.width=Math.min(100, comm/10000*100)+'%';
    document.getElementById('commBarLabel').textContent=naira(comm)+' of ₦10,000 minimum payout • '+(comm>=10000?'Ready for payout':'Keep going');
    const dbg=document.getElementById('debug'); if(dbg){ dbg.textContent='Logged in: '+currentUser.email+'\nShowing for: '+linkedEmail+'\nTotal delivery_requests scanned: '+qs.size+'\nMatched trips: '+rows.length+'\nAll trip emails found in DB: '+[...new Set(qs.docs.flatMap(d=>[d.data().customerEmail,d.data().email,d.data().driverEmail,d.data().riderEmail].filter(Boolean)))].join(', ')+'\nWallet key looked up: '+emailKeyOf(linkedEmail)+'\nIf matched=0, trips are under a DIFFERENT email than the one above. Switch to that verified email.'; }
    document.getElementById('feed').innerHTML = rows.slice(0,50).map(o=>`<div class="row"><div style="display:flex;justify-content:space-between"><b>${o.pickup||'Pickup'} → ${o.dropoff||'Dropoff'}</b>${badgeFor(o)}</div><div class="muted">${o.created.toLocaleString()} • ${o.status||'delivered'} • Rider: ${o.driverEmail||o.riderEmail||o.driverId||'—'}</div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Trip Fee: <b>${naira(o.fee)}</b></span><span style="color:#059669">Your 3%: <b>${naira(o.fee*0.03)}</b></span></div></div>`).join('') || '<p class="muted">No delivered trips yet for '+linkedEmail+'. Complete a trip with this email on Customer / Rider app — it will appear here live.</p>';
  });
}
handleLink().then(handled=>{ if(handled) return; auth.onAuthStateChanged(async user=>{ if(!user){ showAuth(); return; } const snap=await db.collection('users').doc(user.uid).get(); const me=snap.exists?snap.data():{}; if(!me.affiliate && !me.businessName){ document.getElementById('content').innerHTML='<p>Logged in as <b>'+user.email+'</b></p><p>Turn this into a Business?</p><input id="bn" placeholder="Business Name"><button id="go">Become Business</button>'; document.getElementById('go').onclick=async()=>{ await db.collection('users').doc(user.uid).set({affiliate:true,affiliateCode:me.affiliateCode||('FLT-'+Math.floor(100000+Math.random()*900000)),businessName:document.getElementById('bn').value,customerEmail:user.email,linkedEmail:user.email,linkedEmails:[user.email],roles:['business','customer']},{merge:true}); location.reload(); }; return; } showDashboard(user,me); }); });
</script></body></html>
