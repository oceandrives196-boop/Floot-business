<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floot NG — One Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>body{font-family:system-ui;background:#7C3AED;margin:0;padding:16px} .card{max-width:420px;margin:auto;background:#fff;border-radius:22px;padding:22px} input,button,select{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box} button{background:#7C3AED;color:#fff;border:0;font-weight:800;cursor:pointer} .ghost{background:#F5F3FF;color:#7C3AED} .tabs{display:flex;gap:8px} .tabs button{flex:1} .tabs .active{background:#7C3AED;color:#fff} .tabs .inactive{background:#F5F3FF;color:#7C3AED} .muted{color:#666;font-size:13px} .err{color:red} .ok{color:green} .center{text-align:center}</style>
</head><body><div class="card">
<h2 class="center">FLOOT NG</h2><p class="muted center">ONE LOGIN • EMAIL TIED TO WALLET<br>Same email + password works on Customer, Rider & Business</p>
<div class="tabs"><button id="tabIn" class="active" onclick="showTab('in')">Sign In</button><button id="tabUp" class="inactive" onclick="showTab('up')">Sign Up</button></div>
<div id="content"></div>
</div><script>
// SAME Firebase project as all 3 apps
const firebaseConfig={apiKey:"AIzaSyBVIJq5napb_egiLdKhGtySZoPeLUkY9Q4",authDomain:"floot-delivery.firebaseapp.com",projectId:"floot-delivery",storageBucket:"floot-delivery.firebasestorage.app",messagingSenderId:"786230599434",appId:"1:786230599434:web:e1913bd8c2e69a7e1c64f3"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
let mode='in';
function showTab(m){ mode=m; document.getElementById('tabIn').className=m==='in'?'active':'inactive'; document.getElementById('tabUp').className=m==='up'?'active':'inactive'; render(); }
function render(){
  document.getElementById('content').innerHTML = `
  ${mode==='up' ? '<input id="name" placeholder="Full Name / Business Name *"><input id="phone" placeholder="Phone / WhatsApp *"><select id="type"><option value="customer">Customer</option><option value="rider">Rider / Driver</option><option value="business">Business</option></select>' : ''}
  <input id="email" type="email" placeholder="Email Address *">
  <input id="password" type="password" placeholder="Password (min 6) *">
  <button onclick="${mode==='up' ? 'doSignup()' : 'doLogin()'}">${mode==='up' ? 'Create Floot Account' : 'Sign In to Floot'}</button>
  ${mode==='in' ? '<button class="ghost" onclick="forgot()">Forgot Password? Send Reset Email</button>' : '<p class="muted">One signup creates you in ALL 3 apps: Customer + Rider + Business. Same wallet.</p>'}
  <p id="msg" class="muted"></p>`;
}
async function createAllDocs(uid, email, password, name, phone, type){
  const emailKey=email.replace(/[^a-z0-9]/g,'_');
  const affiliateCode='FLT-'+Math.floor(100000+Math.random()*900000);
  // 1. users/{uid} — Business + Customer look here
  await db.collection('users').doc(uid).set({uid,email,phone:phone||'',name:name||email.split('@')[0],businessName:name||'',emailKey,affiliate:true,affiliateCode,roles:['customer','rider','business'],accountType:type,lastLogin:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  // 2. wallets/{uid} + wallets/{emailKey} — Customer (Ride) looks here, same wallet everywhere
  const wallet={uid,email,phone:phone||'',name:name||email.split('@')[0],emailKey,balance:12500,walletBalance:12500,status:'offline',role:'rider',isOnline:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  await db.collection('wallets').doc(uid).set(wallet,{merge:true});
  await db.collection('wallets').doc(emailKey).set(wallet,{merge:true});
  // 3. drivers/{emailKey} + drivers/{uid} — Rider (Drive) looks here, with plain password field like Rider signup does
  const driver={id:emailKey,uid,name:name||email.split('@')[0],phone:phone||'',email,password,businessName:name||'',affiliate:true,affiliateCode,deliveryMode:'bike',vehicleType:'bike',bikeNumber:'BUSINESS-'+affiliateCode,totalEarnings:0,totalTrips:0,walletBalance:0,status:'active',isActive:true,isBlocked:false,isSuspended:false,isDeactivated:false,createdAt:new Date().toISOString()};
  await db.collection('drivers').doc(emailKey).set(driver,{merge:true});
  await db.collection('drivers').doc(uid).set(driver,{merge:true});
  try{ localStorage.setItem('floot_driver_session', JSON.stringify(driver)); }catch(e){}
  return affiliateCode;
}
async function doSignup(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const type=document.getElementById('type').value;
  const msg=document.getElementById('msg');
  if(!email||!password||password.length<6||!name){ msg.className='err'; msg.textContent='Fill Name, valid Email, password min 6.'; return; }
  msg.textContent='Creating your Floot account in all 3 apps...';
  try{
    let cred=null;
    try{ cred=await auth.createUserWithEmailAndPassword(email,password); }
    catch(e){
      if(e.code==='auth/email-already-in-use'){
        msg.className='err'; msg.textContent='This email already has an account. Tap Sign In instead — or Forgot Password if you forgot it.';
        showTab('in'); return;
      } throw e;
    }
    const code=await createAllDocs(cred.user.uid, email, password, name, phone, type);
    try{ await cred.user.sendEmailVerification(); }catch(e){}
    msg.className='ok'; msg.textContent='✅ Done! One account created for Customer + Rider + Business. Affiliate: '+code+'. Verification email sent to '+email+'. Now Sign In with same email + password on ANY Floot app.';
    await auth.signOut();
  }catch(e){ msg.className='err'; msg.textContent=e.message; }
}
async function doLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  if(!email||!password){ msg.textContent='Enter email + password.'; return; }
  msg.textContent='Signing you in...';
  try{
    // 1. Try Firebase Auth (Customer + Business use this)
    let cred=null;
    try{ cred=await auth.signInWithEmailAndPassword(email,password); }
    catch(authErr){
      // 2. Fallback: Rider signup never created Auth, it only created drivers doc with password field. Check that.
      const emailKey=email.replace(/[^a-z0-9]/g,'_');
      let driver=null;
      try{ const s=await db.collection('drivers').doc(emailKey).get(); if(s.exists) driver=s.data(); }catch(e){}
      if(!driver){ try{ const q=await db.collection('drivers').where('email','==',email).limit(1).get(); if(!q.empty) driver=q.docs[0].data(); }catch(e){} }
      if(driver && driver.password===password){
        // Driver password matches but no Auth user — create Auth now and backfill all docs, then login succeeds
        cred=await auth.createUserWithEmailAndPassword(email,password);
        await createAllDocs(cred.user.uid, email, password, driver.name||driver.businessName||'', driver.phone||'', 'rider');
        msg.className='ok'; msg.textContent='✅ Your old Rider account had no Auth login — I just created it and linked it. You are now logged in everywhere.';
      } else { throw authErr; }
    }
    // 3. Make sure all docs exist even if Auth existed but docs were missing (old Business accounts)
    const uid=cred.user.uid;
    try{
      const uSnap=await db.collection('users').doc(uid).get();
      if(!uSnap.exists || !uSnap.data().emailKey){
        // Backfill missing docs from Auth user
        await createAllDocs(uid, email, password, cred.user.displayName||email.split('@')[0], '', 'customer');
      }
    }catch(e){ console.log('backfill failed', e); }
    msg.className='ok'; msg.textContent='✅ Logged in as '+email+'. Same wallet on Customer, Rider & Business. '+(cred.user.emailVerified?'Email verified ✅':'Email not verified yet — check inbox for verification link.');
  }catch(e){
    msg.className='err';
    if(e.code==='auth/invalid-credential' || e.code==='auth/user-not-found' || e.code==='auth/wrong-password'){
      msg.textContent='Invalid email or password. If you signed up on Business before, tap Sign Up with SAME email + password to repair it — or Forgot Password.';
    } else { msg.textContent='Login failed: '+e.message; }
  }
}
async function forgot(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const msg=document.getElementById('msg');
  if(!email){ msg.textContent='Enter your email first.'; return; }
  try{ await auth.sendPasswordResetEmail(email); msg.className='ok'; msg.textContent='✅ Reset email sent to '+email+' — check inbox + spam.'; }
  catch(e){ msg.className='err'; msg.textContent=e.message; }
}
render();
</script></body></html>
